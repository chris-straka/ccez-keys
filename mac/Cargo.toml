[package]
name = "ccez-keys-mac"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "ccez-keys for the Mac: what you type, previewed in the languages you're learning"

[[bin]]
name = "ccez-keys-mac"
path = "src/main.rs"

[dependencies]
ccez-keys-core = { path = "../core" }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
tray-icon = "0.26"
auto-launch = "0.6"
unicode-segmentation = "1"
