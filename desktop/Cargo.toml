[package]
name = "ccez-keys-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "ccez-keys on the Mac, Linux and Windows: what you type, previewed in the languages you're learning"

[[bin]]
name = "ccez-keys-desktop"
path = "src/main.rs"

[dependencies]
ccez-keys-core = { path = "../core" }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Mozilla's Firefox Translations models, pure Rust (portable: no C++ to build on Windows).
fxtranslate = { version = "0.5", default-features = false, features = ["portable"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
arboard = { version = "3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# The focused field through AT-SPI (the accessibility bus GTK, Qt, Firefox and Chromium speak).
atspi = { version = "0.30", default-features = false, features = ["proxies", "connection"] }
async-io = "2"
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures-lite = "2"

[target.'cfg(windows)'.dependencies]
# The focused field through UI Automation.
uiautomation = "0.25"
tray-icon = "0.26"
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
tray-icon = "0.26"
auto-launch = "0.6"
unicode-segmentation = "1"
