[package]
name = "ccez-keys-core"
version = "0.1.0"
description = "ccez-keys' core: words, autocorrect, layouts, settings and logs, for Kotlin through UniFFI"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "ccez_keys_core"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
# Dictionaries, readings, word statuses and ccez-words sync, the AI client:
# the library ccez-tube's learning code moved into.
ccez-lang-core = { git = "https://github.com/chris-straka/ccez-lang-core", tag = "v0.1.1", features = ["ja"] }
# The review schedule's round with ccez-words (same client ccez-lang-core
# uses: 0.12 with ring-backed rustls, no cmake on Android).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt", "time"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-normalization = "0.1.26"
uniffi = { version = "0.32" }
