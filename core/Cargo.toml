[package]
name = "ccez-keys-core"
version = "0.1.0"
description = "ccez-keys' core: words, autocorrect, layouts, settings and logs, for Kotlin through UniFFI"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "ccez_keys_core"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-normalization = "0.1.26"
uniffi = { version = "0.32" }

[profile.release]
lto = true
codegen-units = 1
# No strip: uniffi-bindgen reads the metadata symbols; AGP strips the
# copies it packages.
opt-level = "z"
